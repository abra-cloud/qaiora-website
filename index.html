
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QAIORA - Something intelligent is coming.">
  <title>QAIORA | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, #174b59 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #26345c 0, transparent 40%),
        #0b1220;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 720px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 8px;
      margin-bottom: 35px;
    }

    .logo span {
      color: #72d6ca;
    }

    .status {
      display: inline-block;
      border: 1px solid #72d6ca;
      color: #72d6ca;
      border-radius: 30px;
      padding: 9px 20px;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(36px, 7vw, 62px);
      margin-bottom: 22px;
      line-height: 1.15;
    }

    p {
      color: #b7c4d5;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .line {
      width: 65px;
      height: 3px;
      background: #72d6ca;
      margin: 0 auto 35px;
    }

    footer {
      color: #718096;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">QAI<span>ORA</span></div>

    <div class="status">COMING SOON</div>

    <h1>Something intelligent is coming.</h1>

    <div class="line"></div>

    <p>
      We are building something new.<br>
      Our website is currently under construction.
      Stay tuned!
    </p>

    <footer>
      © 2026 QAIORA. All rights reserved.
      <br><br>
      qaiora.com
    </footer>
  </main>
</body>
</html>
