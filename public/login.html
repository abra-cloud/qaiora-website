
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>QAIORA – Zugang</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #102238;
      --line: rgba(167,203,218,.2);
      --text: #f4f8fb;
      --muted: #a8b8c8;
      --teal: #62d8ce;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          ellipse at 80% 4%,
          rgba(38,154,160,.18),
          transparent 34rem
        ),
        var(--bg);
      font: 16px/1.5 Inter, system-ui, sans-serif;
      color: var(--text);
    }

    main {
      width: min(100%, 460px);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(16,34,56,.9);
      box-shadow: 0 24px 80px #0005;
    }

    .brand {
      font-weight: 900;
      letter-spacing: .16em;
      color: var(--teal);
      font-size: 1.2rem;
    }

    .tag {
      color: var(--muted);
      margin: 6px 0 26px;
      font-size: .9rem;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0 0 8px;
    }

    p {
      color: var(--muted);
    }

    label {
      display: block;
      font-weight: 650;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #081827;
      color: var(--text);
      font: inherit;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg,#8ce8dc,#48c5bc);
      color: #06151e;
      font-weight: 800;
      font-size: .95rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary {
      background: transparent;
      color: var(--teal);
      border: 1px solid var(--line);
    }

    .switch {
      display: flex;
      gap: 10px;
      margin: 22px 0 0;
    }

    .switch button {
      margin: 0;
    }

    .switch button[aria-pressed="true"] {
      background: rgba(98,216,206,.16);
      color: var(--teal);
      border: 1px solid rgba(98,216,206,.45);
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 9px;
    }

    .text-link {
      display: inline-block;
      width: auto;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: none;
      color: var(--teal);
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
      text-decoration: none;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    #backToLogin {
      margin-top: 14px;
    }

    #message {
      min-height: 48px;
      margin-top: 16px;
      font-size: .9rem;
      color: var(--teal);
    }

    .small {
      font-size: .78rem;
      color: #8296a9;
      margin-top: 18px;
    }

    [hidden] {
      display: none !important;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<main>
  <div class="brand">QAIORA</div>
  <div class="tag">The Intelligence Behind Quality.</div>

  <h1 id="heading">Willkommen bei QAIORA</h1>

  <p id="intro">
    Melde dich an oder erstelle ein Konto.
    Nach der E-Mail-Bestätigung erhältst du Zugang.
  </p>

  <div class="switch" id="modeSwitch" role="group" aria-label="Zugangsart">
    <button
      class="secondary"
      id="loginTab"
      type="button"
      aria-pressed="true">
      Anmelden
    </button>

    <button
      class="secondary"
      id="signupTab"
      type="button"
      aria-pressed="false">
      Registrieren
    </button>
  </div>

  <form id="authForm">
    <label for="email" id="emailLabel">E-Mail-Adresse</label>
    <input
      id="email"
      type="email"
      autocomplete="email"
      required>

    <label for="password" id="passwordLabel">Passwort</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      minlength="8"
      required>

    <div class="forgot-row" id="forgotRow">
      <button
        class="text-link"
        id="forgotLink"
        type="button">
        Passwort vergessen?
      </button>
    </div>

    <button id="submitButton" type="submit">
      Anmelden
    </button>

    <button
      class="text-link"
      id="backToLogin"
      type="button"
      hidden>
      Zurück zur Anmeldung
    </button>
  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <div class="small">
    Deine Anforderungen werden weiterhin lokal in deinem Browser
    verarbeitet. QAIORA führt auf dieser Seite keine KI-Analyse aus.
  </div>
</main>

<script>
(() => {
  const SUPABASE_URL =
    'https://feljpsrmlkwpabzgmbrx.supabase.co';

  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_fsmlio2uCWd932eQUQ7A-w_qwhI5qOH';

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  const form = document.getElementById('authForm');
  const message = document.getElementById('message');
  const loginTab = document.getElementById('loginTab');
  const signupTab = document.getElementById('signupTab');
const submitButton = document.getElementById('submitButton');
  const passwordInput = document.getElementById('password');
const emailInput = document.getElementById('email');
const emailLabel = document.getElementById('emailLabel');
const passwordInput = document.getElementById('password');
const passwordLabel = document.getElementById('passwordLabel');
  const forgotRow = document.getElementById('forgotRow');
  const forgotLink = document.getElementById('forgotLink');
  const backToLogin = document.getElementById('backToLogin');
  const modeSwitch = document.getElementById('modeSwitch');

  let mode = 'login';

  function setMode(next) {
    mode = next;

    const isLogin = mode === 'login';
    const isSignup = mode === 'signup';
    const isForgot = mode === 'forgot';
    const isRecovery = mode === 'recovery';

    modeSwitch.hidden = isForgot || isRecovery;

    loginTab.setAttribute(
      'aria-pressed',
      String(isLogin)
    );

    signupTab.setAttribute(
      'aria-pressed',
      String(isSignup)
    );

    passwordInput.hidden = isForgot;
passwordLabel.hidden = isForgot;

emailInput.hidden = isRecovery;
emailLabel.hidden = isRecovery;
emailInput.required = !isRecovery;

passwordInput.required = !isForgot;

    forgotRow.hidden = !isLogin;
    backToLogin.hidden = !isForgot;

    submitButton.textContent =
      isLogin ? 'Anmelden' :
      isSignup ? 'Konto erstellen' :
      isForgot ? 'Reset-Link senden' :
      'Passwort speichern';

    document.getElementById('heading').textContent =
      isLogin ? 'Willkommen zurück' :
      isSignup ? 'QAIORA-Konto erstellen' :
      isForgot ? 'Passwort zurücksetzen' :
      'Neues Passwort festlegen';

    document.getElementById('intro').textContent =
      isLogin
        ? 'Melde dich mit deinem bestätigten Konto an.'
        : isSignup
        ? 'Registriere dich mit deiner E-Mail-Adresse. Du erhältst anschließend eine Bestätigungs-E-Mail.'
        : isForgot
        ? 'Gib deine registrierte E-Mail-Adresse ein. Wir senden dir einen Link zum Zurücksetzen deines Passworts.'
        : 'Vergib ein neues Passwort für dein QAIORA-Konto.';

    passwordInput.autocomplete =
      isSignup || isRecovery
        ? 'new-password'
        : 'current-password';

    passwordLabel.textContent =
      isRecovery ? 'Neues Passwort' : 'Passwort';

    passwordInput.minLength = 8;

    message.textContent = '';
  }

  loginTab.addEventListener(
    'click',
    () => setMode('login')
  );

  signupTab.addEventListener(
    'click',
    () => setMode('signup')
  );

  forgotLink.addEventListener('click', () => {
    setMode('forgot');
  });

  backToLogin.addEventListener('click', () => {
    setMode('login');
  });


async function establishWorkerSession(session) {
  message.textContent = 'Anmeldung wird überprüft …';

  try {
    const response = await fetch('/auth/session', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${session.access_token}`
      }
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        `Cloudflare-Session fehlgeschlagen (${response.status}): ${result.error || 'Unbekannter Fehler'}`
      );
    }

    message.textContent = 'Anmeldung erfolgreich. QAIORA wird geöffnet …';

    location.replace('/');
  } catch (error) {
    message.textContent = error.message;
    throw error;
  }
}


  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    submitButton.disabled = true;
    message.textContent = 'Einen Moment bitte …';

    try {
      const email =
        document.getElementById('email').value.trim();

      const password = passwordInput.value;

      if (mode === 'signup') {
        const { data, error } =
          await client.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: `${location.origin}/login`
            }
          });

        if (error) throw error;

        if (data.session) {
          await establishWorkerSession(data.session);
        } else {
          message.textContent =
            'Registrierung gestartet. Bitte öffne die Bestätigungs-E-Mail und bestätige deine Adresse. Danach kannst du dich hier anmelden.';
        }

      } else if (mode === 'login') {
        const { data, error } =
          await client.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        await establishWorkerSession(data.session);

      } else if (mode === 'forgot') {
        const { error } =
          await client.auth.resetPasswordForEmail(email, {
            redirectTo: `${location.origin}/login?reset=1`
          });

        if (error) throw error;

        message.textContent =
          'Falls ein Konto mit dieser E-Mail-Adresse existiert, erhältst du eine E-Mail mit einem Link zum Zurücksetzen deines Passworts. Bitte prüfe auch deinen Spam-Ordner.';

      } else if (mode === 'recovery') {
        const { error } =
          await client.auth.updateUser({
            password
          });

        if (error) throw error;

        await client.auth.signOut();

        passwordInput.value = '';
        setMode('login');

        message.textContent =
          'Dein Passwort wurde erfolgreich geändert. Du kannst dich jetzt mit deinem neuen Passwort anmelden.';
      }

    } catch (error) {
      message.textContent =
        error.message || 'Es ist ein Fehler aufgetreten.';

    } finally {
      submitButton.disabled = false;
    }
  });

  const query = new URLSearchParams(location.search);

  // Logout: Supabase-Sitzung und Worker-Cookie löschen.
  if (query.has('logout')) {
    (async () => {
      try {
        await fetch('/auth/logout', {
          method: 'POST'
        });

        await client.auth.signOut();

        message.textContent =
          'Du wurdest abgemeldet.';

      } catch {
        message.textContent =
          'Abmeldung abgeschlossen. Bitte schließe dieses Fenster.';
      }
    })();
  }

  // Nach E-Mail-Bestätigung keine automatische Weiterleitung.
  if (query.has('verified')) {
    message.textContent =
      'E-Mail-Adresse bestätigt. Bitte melde dich an.';
  }

  // Nach dem Klick auf den Passwort-Reset-Link.
  if (query.has('reset')) {
    setMode('recovery');
    message.textContent =
      'Dein Reset-Link wurde geöffnet. Bitte vergib ein neues Passwort.';
  }

  // Absichtlich keine automatische getSession()-Weiterleitung.
})();
</script>
</body>
</html>
